<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión – ÍndiceIA</title>
    <meta name="description" content="Accedé a ÍndiceIA para configurar tu asistente inteligente para comercios o servicios.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Iniciar Sesión – ÍndiceIA">
    <meta property="og:description" content="Accedé a tu panel de gestión inteligente.">
    <meta property="og:image" content="/images/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">

    <script type="module" src="/src/controllers/flowController.js" defer></script>



</head>


<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <h1>Mi Plataforma IA</h1>
      <p id="loginSubtitle">Tu vendedor IA personalizado</p>
    </div>

    <form id="emailLogin" data-register="false" class="login-form">
      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" required />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" required />
        </div>
      </div>

      <!-- Solo registro -->
      <div class="input-group" id="repeatPasswordGroup" style="display:none;">
        <label for="repeatPassword">Repetir Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="repeatPassword" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="btnText">Iniciar Sesión</span>
      </button>
    </form>

    <button class="btn btn-google" id="googleLogin">
      <!-- ✅ Las imágenes del public/ se referencian directo desde /img -->
      <img class="google-icon" src="./img/google-icon.svg" alt="Google" />
      Ingresar con Google
    </button>

    <div class="divider">o</div>

    <div class="register-link" id="toggleModeLink">
      ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
    </div>
  </div>
</body>
</html>
