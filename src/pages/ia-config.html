<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Configuración de IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <main class="container">

    <!-- ================= IA IDENTIDAD ================= -->
    <section class="card">
      <h3>Identidad del asistente</h3>

      <label>Nombre de la IA</label>
      <input id="aiName" type="text" placeholder="Ej: JuancaBot" />

      <label>Idioma</label>
      <select id="aiLanguage">
        <option value="es-AR">Español (Argentina)</option>
        <option value="es">Español neutro</option>
      </select>

      <label>Personalidad</label>
      <select id="aiPersonality">
        <option value="amigable">Amigable</option>
        <option value="profesional">Profesional</option>
        <option value="directa">Directa</option>
      </select>

      <label>Tono</label>
      <select id="aiTone">
        <option value="informal">Informal</option>
        <option value="neutral">Neutral</option>
        <option value="formal">Formal</option>
      </select>
    </section>

    <!-- ================= SALUDO ================= -->
    <section class="card">
      <h3>Mensaje de bienvenida</h3>
      <textarea
        id="aiGreeting"
        rows="3"
        placeholder="Hola! Soy JuancaBot, estoy acá para ayudarte con tu consulta"
      ></textarea>
    </section>

    <!-- ================= COMPORTAMIENTO ================= -->
    <section class="card">
      <h3>Comportamiento de la IA</h3>

      <label>Formato de respuestas</label>
      <select id="formatoRespuestas">
        <option value="breves">Breves</option>
        <option value="detalladas">Detalladas</option>
      </select>

      <label>Proactividad</label>
      <select id="proactividad">
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
      </select>

      <label>Cuando el local está cerrado</label>
      <select id="localCerrado">
        <option value="informar">Informar horario</option>
        <option value="derivar">Derivar igual</option>
      </select>
    </section>

    <!-- ================= MENSAJES CANÓNICOS ================= -->
    <section class="card">
      <h3>Mensajes por canal</h3>

      <label>Mensaje WhatsApp</label>
      <textarea id="mensajeWhatsapp" rows="2"></textarea>

      <label>Mensaje Instagram</label>
      <textarea id="mensajeInstagram" rows="2"></textarea>

      <label>Mensaje Web</label>
      <textarea id="mensajeWeb" rows="2"></textarea>

      <label>Mensaje por defecto</label>
      <textarea id="mensajeDefault" rows="2"></textarea>
    </section>

    <!-- ================= CANALES ALTERNATIVOS ================= -->
    <section class="card">
      <h3>Canales alternativos de contacto</h3>

      <!-- ACA INYECTA renderCanalesAlternativos() -->
      <div id="contactosValidacion"></div>
    </section>

  </main>

  <script type="module" src="./ia-config.js"></script>
</body>
</html>
