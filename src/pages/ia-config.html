<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Configuración de IA — ÍndiceIA</title>

  <!-- SEO / META -->
  <meta name="description" content="Configurá el comportamiento, personalidad y capacidades de tu IA comercial." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- FAVICON -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS ADICIONAL -->
  <link rel="stylesheet" href="../styles/progressOverlay.css">
</head>

<body data-page="ia-config">

  <!-- ================= HEADER ================= -->
  <header id="layout-header"></header>

  <!-- ================= MAIN ================= -->
  <main id="main-content">
    <div class="container">

      <!-- ================= IDENTIDAD IA ================= -->
      <section class="card">
        <h2>Identidad del asistente</h2>

        <div class="form-group">
          <label for="aiName">Nombre de la IA</label>
          <input type="text" id="aiName" placeholder="Ej: JuancaBot" />
        </div>

        <div class="form-group">
          <label for="aiLanguage">Idioma</label>
          <select id="aiLanguage">
            <option value="es-AR">Español (Argentina)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="aiPersonality">Personalidad</label>
          <select id="aiPersonality">
            <option value="">Seleccionar</option>
            <option value="amigable">Amigable</option>
            <option value="formal">Formal</option>
            <option value="vendedor">Vendedor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="aiTone">Tono</label>
          <select id="aiTone">
            <option value="">Seleccionar</option>
            <option value="informal">Informal</option>
            <option value="neutral">Neutral</option>
            <option value="formal">Formal</option>
          </select>
        </div>

        <div class="form-group">
          <label for="aiGreeting">Mensaje de bienvenida</label>
          <textarea
            id="aiGreeting"
            rows="3"
            placeholder="Hola! Soy JuancaBot, estoy acá para ayudarte 😊"
          ></textarea>
          <small id="greetingCount" class="char-counter">0/200</small>
          <div id="greetingPreview" class="greeting-preview">
            Tu saludo aparecerá aquí...
          </div>
        </div>
      </section>

      <!-- ================= COMPORTAMIENTO ================= -->
      <section class="card">
        <h2>Comportamiento</h2>

        <div class="form-group">
          <label for="proactividad">Nivel de proactividad</label>
          <select id="proactividad">
            <option value="">Seleccionar</option>
            <option value="bajo">Bajo</option>
            <option value="medio">Medio</option>
            <option value="alto">Alto</option>
          </select>
        </div>

        <div class="form-group">
          <label for="formatoRespuestas">Formato de respuestas</label>
          <select id="formatoRespuestas">
            <option value="">Seleccionar</option>
            <option value="cortas">Cortas</option>
            <option value="detalladas">Detalladas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sinPrecio">Si no hay precio</label>
          <select id="sinPrecio">
            <option value="">Seleccionar</option>
            <option value="informar">Informar</option>
            <option value="consultar">Pedir consulta</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sinStock">Si no hay stock</label>
          <select id="sinStock">
            <option value="">Seleccionar</option>
            <option value="informar">Informar</option>
            <option value="ofrecerAlternativa">Ofrecer alternativa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="localCerrado">Si el local está cerrado</label>
          <select id="localCerrado">
            <option value="">Seleccionar</option>
            <option value="informar">Informar horario</option>
            <option value="tomarMensaje">Tomar mensaje</option>
          </select>
        </div>
      </section>

      <!-- ================= CAPACIDADES COGNITIVAS ================= -->
      <section class="card">
        <h2>Capacidades de la IA</h2>
        <p class="section-description">
          Activá qué tan lejos puede razonar tu asistente dentro de tu negocio.
          <br />
          <strong>No cambia lo que vendés</strong>, solo cómo explica y ayuda.
        </p>

        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" id="cap_contextualizar" />
            <span>
              <strong>Explicar mejor los servicios</strong><br />
              Puede dar ejemplos, analogías simples y explicar beneficios aunque no estén escritos palabra por palabra.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_relacionar" />
            <span>
              <strong>Relacionar productos entre sí</strong><br />
              Puede sugerir combinaciones lógicas o alternativas dentro de tu catálogo.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_deducir" />
            <span>
              <strong>Deducir necesidades del cliente</strong><br />
              Puede inferir qué le conviene al cliente según lo que pregunta.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_explicar_tecnico" />
            <span>
              <strong>Traducir lo técnico a simple</strong><br />
              Convierte explicaciones complejas en lenguaje claro y cotidiano.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_comparar" />
            <span>
              <strong>Comparar opciones</strong><br />
              Puede explicar diferencias entre productos o servicios del negocio.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_argumentar" />
            <span>
              <strong>Argumentar por qué algo conviene</strong><br />
              Puede justificar recomendaciones sin inventar información.
            </span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="cap_recordar_contexto" />
            <span>
              <strong>Recordar el contexto de la charla</strong><br />
              Mantiene coherencia durante la conversación con el cliente.
            </span>
          </label>
        </div>

        <small class="helper-text">
          💡 Si no activás nada, la IA funciona igual que siempre.
        </small>
      </section>

      <!-- ================= GUARDAR ================= -->
      <div class="bottom-action-bar">
        <button id="saveChangesBtnBottom" class="btn btn-primary btn-save" disabled>
          Guardar Cambios
        </button>
      </div>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer id="layout-footer"></footer>

  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="./ia-config.js"></script>

</body>
</html>
