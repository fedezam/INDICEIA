<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de IA — ÍndiceIA</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>

<body data-page="ia-config">
  
  <!-- 1. LAYOUT GLOBAL (inyectado por renderLayout()) -->
  <header id="layout-header"></header>
  
  <!-- 2. CONTENIDO PRINCIPAL -->
  <main>
    <div class="container">
      <!-- El contenido se renderiza desde ia-config.js -->
    </div>

  <!-- 3. BOTÓN INFERIOR FIJO -->
  <div class="bottom-action-bar">
    <button id="saveChangesBtnBottom" class="btn-save" disabled>
      Guardar Cambios
    </button>
  </div>
  
  <!-- 4. FOOTER -->
  <footer id="layout-footer"></footer>

  <!-- Scripts -->
  <script type="module" src="./ia-config.js"></script>

</body>
</html>
