<!-- src/pages/servicios.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Servicios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- El CSS se importa desde servicios.js -->
</head>
<body>

  <!-- ==================== HEADER / LAYOUT ==================== -->
  <!-- renderLayout() del skeleton se encarga de esto -->

  <!-- ==================== CONTENIDO ==================== -->
  <main class="page-content">

    <!-- ---------- INTRO ---------- -->
    <section class="page-intro">
      <h1>Servicios</h1>
      <p>
        Declarás los servicios que ofrece tu comercio.
        No son productos individuales, sino prestaciones que explican
        <strong>qué hacés, cómo lo hacés y en qué condiciones</strong>.
      </p>
    </section>

    <!-- ---------- TARJETAS DE SERVICIOS ---------- -->
    <section
      id="serviciosContainer"
      class="servicios-container"
    >
      <!--
        Las tarjetas se renderizan dinámicamente desde servicios.js

        Cada tarjeta representa UN servicio,
        pero NO guarda de forma independiente.
      -->
    </section>

    <!-- ---------- AYUDA / NOTA ---------- -->
    <section class="page-hint">
      <p>
        💡 No todos los servicios necesitan precio fijo o duración exacta.
        Completá solo lo que aplique a tu caso.
      </p>
    </section>

  </main>

  <!-- ==================== FOOTER / SAVE ==================== -->
  <!--
    El botón Guardar NO va acá.
    Lo inyecta el skeleton (saveChangesBtnBottom)
    y controla el flujo hacia dashboard.
  -->

  <!-- ==================== SCRIPT ==================== -->
  <script type="module" src="./servicios.js"></script>

</body>
</html>
