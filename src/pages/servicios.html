<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Servicios</title>
</head>

<body>
  <main class="page-container servicios-page">

    <!-- ================= TARJETA 1: IDENTIDAD ================= -->
    <section class="card">
      <h2 class="card-title">Servicio</h2>

      <label class="form-label">
        ¿Qué servicio ofrecés?
        <input
          type="text"
          placeholder="Ej: Masaje descontracturante"
          oninput="window.setNombre(this.value)"
        />
      </label>

      <label class="form-label">
        Descripción (opcional)
        <textarea
          placeholder="Detalle breve para el cliente"
          oninput="window.setDescripcion(this.value)"
        ></textarea>
      </label>
    </section>

    <!-- ================= TARJETA 2: MODALIDAD ================= -->
    <section class="card">
      <h2 class="card-title">¿Cómo se presta?</h2>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" value="presencial" onchange="handleModalidades()" />
          Presencial
        </label>
        <label>
          <input type="checkbox" value="remoto" onchange="handleModalidades()" />
          Remoto
        </label>
        <label>
          <input type="checkbox" value="domicilio" onchange="handleModalidades()" />
          A domicilio
        </label>
      </div>
    </section>

    <!-- ================= TARJETA 3: PRECIO ================= -->
    <section class="card">
      <h2 class="card-title">Precio</h2>

      <div class="radio-group">
        <label>
          <input type="radio" name="precio" onchange="setPrecioConsultar()" />
          Consultar
        </label>

        <label>
          <input type="radio" name="precio" onchange="togglePrecioFijo(true)" />
          Precio fijo
        </label>
      </div>

      <div id="precioFijoContainer" class="hidden">
        <input
          type="number"
          placeholder="Valor"
          oninput="setPrecioFijo(this.value)"
        />
      </div>
    </section>

    <!-- ================= TARJETA: DISPONIBILIDAD ================= -->
<section class="card">
  <h2 class="card-title">Disponibilidad</h2>

  <select onchange="setDisponibilidad(this.value)">
    <option value="">Seleccionar</option>
    <option value="inmediata">Disponible de forma inmediata</option>
    <option value="con_agenda">Requiere coordinación previa</option>
    <option value="no_disponible">No disponible actualmente</option>
  </select>
</section>


    <!-- ================= TARJETA 5: DURACIÓN ================= -->
    <section class="card">
      <h2 class="card-title">Duración (opcional)</h2>

      <input
        type="number"
        placeholder="Minutos (ej: 40)"
        oninput="setDuracion(this.value)"
      />
    </section>

  </main>

  <!-- ================= HELPERS UI ================= -->
  <script>
    function handleModalidades() {
      const checked = Array.from(
        document.querySelectorAll('input[type="checkbox"]:checked')
      ).map(i => i.value);

      window.setModalidadesSeleccionadas(checked);
    }

    function togglePrecioFijo(show) {
      document
        .getElementById('precioFijoContainer')
        .classList.toggle('hidden', !show);

      if (!show) {
        window.setPrecioConsultar();
      }
    }
  </script>

  <script type="module" src="./servicios.js"></script>
</body>
</html>
