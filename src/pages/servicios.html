<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Servicios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <!-- Layout general lo inyecta runDataPage -->
  <main class="page-content">

    <!-- ===== INTRO ===== -->
    <section class="page-intro">
      <h1>Servicios</h1>
      <p>
        Declarás los servicios que ofrece tu comercio.
        Cada tarjeta representa un servicio real que la IA podrá explicar
        sin inventar información.
      </p>
    </section>

    <!-- ===== TARJETAS ===== -->
    <section
      id="serviciosContainer"
      class="servicios-container"
    >
      <!-- Las tarjetas se renderizan desde servicios.js -->
    </section>

    <!-- ===== NOTA ===== -->
    <section class="page-hint">
      <p>
        💡 Completá solo lo que aplique.
        Si un dato no existe, no se guarda ni se usa.
      </p>
    </section>

  </main>

  <!-- El botón Guardar es global (skeleton) -->
  <script type="module" src="./servicios.js"></script>
</body>
</html>
