<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Servicios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<main class="page">
  <h1>Servicios</h1>
  <p class="page-hint">
    Definí todos los servicios que ofrecés. Podés crear varios y después guardarlos todos juntos.
  </p>

  <!-- ==================== FORMULARIO SERVICIO ==================== -->
  <section class="card">
    <h2>Crear nuevo servicio</h2>

    <!-- NOMBRE -->
    <label class="campo-obligatorio">
      <span class="label-titulo">¿Qué servicio ofrecés? *</span>
      <input
        type="text"
        placeholder="Ej: Masaje descontracturante"
        oninput="page.setNombre(this.value)"
      />
    </label>

    <!-- DESCRIPCIÓN -->
    <label>
      <span class="label-titulo">Descripción (opcional)</span>
      <textarea
        rows="3"
        placeholder="Explicá brevemente en qué consiste el servicio"
        oninput="page.setDescripcion(this.value)"
      ></textarea>
    </label>

    <!-- MODALIDAD -->
    <fieldset class="campo-obligatorio">
      <legend>¿Cómo se presta este servicio? *</legend>

      <label class="checkbox-con-explicacion">
        <input type="checkbox" value="presencial" onchange="updateModalidades()" />
        <strong>Presencial</strong>
      </label>

      <label class="checkbox-con-explicacion">
        <input type="checkbox" value="a_domicilio" onchange="updateModalidades()" />
        <strong>A domicilio</strong>
      </label>

      <label class="checkbox-con-explicacion">
        <input type="checkbox" value="remoto" onchange="updateModalidades()" />
        <strong>Remoto</strong>
      </label>
    </fieldset>

    <!-- PRECIO -->
    <fieldset>
      <legend>Precio</legend>

      <label class="radio-option">
        <input
          type="radio"
          name="precio"
          value="consultar"
          checked
          onchange="page.setPrecioConsultar(); enablePrecioFijo(false)"
        />
        <strong>A consultar</strong>
      </label>

      <label class="radio-option">
        <input
          type="radio"
          name="precio"
          value="fijo"
          onchange="enablePrecioFijo(true)"
        />
        <strong>Precio fijo</strong>
      </label>

      <input
        id="precioFijoInput"
        type="number"
        placeholder="Ej: 5000"
        disabled
        oninput="page.setPrecioFijo(this.value)"
      />
    </fieldset>

    <!-- DISPONIBILIDAD -->
    <fieldset class="campo-obligatorio">
      <legend>¿Cuándo está disponible este servicio? *</legend>

      <label class="checkbox-con-explicacion">
        <input
          type="checkbox"
          name="disponibilidad"
          value="inmediata"
          onchange="updateDisponibilidad(this)"
        />
        <strong>Inmediata</strong>
      </label>

      <label class="checkbox-con-explicacion">
        <input
          type="checkbox"
          name="disponibilidad"
          value="a_coordinar"
          onchange="updateDisponibilidad(this)"
        />
        <strong>A coordinar</strong>
      </label>
    </fieldset>

    <!-- DURACIÓN -->
    <label>
      <span class="label-titulo">Duración aproximada (opcional)</span>
      <input
        type="number"
        placeholder="Ej: 60"
        oninput="page.setDuracion(this.value)"
      />
    </label>

    <!-- VARIANTES -->
    <label>
      <span class="label-titulo">Variantes (opcional)</span>
      <textarea
        rows="4"
        placeholder="Una variante por línea"
        oninput="page.setVariantes(this.value)"
      ></textarea>
    </label>

    <!-- NOTAS -->
    <label>
      <span class="label-titulo">Notas (opcional)</span>
      <textarea
        rows="4"
        placeholder="Información adicional"
        oninput="page.setNotas(this.value)"
      ></textarea>
    </label>

    <!-- AGREGAR -->
    <button
      type="button"
      class="btn-agregar"
      onclick="page.agregarServicio()"
    >
      ➕ Agregar este servicio
    </button>
  </section>

  <!-- ==================== LISTA ==================== -->
  <section class="card lista-servicios">
    <h2>Servicios agregados</h2>
    <div id="serviciosAcumuladosContainer">
      <p class="lista-vacia">No hay servicios agregados aún</p>
    </div>
  </section>
</main>

<button id="saveChangesBtnBottom">
  💾 Guardar y continuar
</button>

<!-- ==================== SCRIPT ==================== -->
<script type="module">
  import * as page from './servicios.js';
  window.page = page;

  window.updateModalidades = () => {
    const values = Array.from(
      document.querySelectorAll(
        'input[type="checkbox"][value="presencial"], input[type="checkbox"][value="a_domicilio"], input[type="checkbox"][value="remoto"]'
      )
    )
      .filter(cb => cb.checked)
      .map(cb => cb.value);

    page.setModalidadesSeleccionadas(values);
  };

  window.updateDisponibilidad = (checkbox) => {
    const checkboxes = document.querySelectorAll('input[name="disponibilidad"]');
    checkboxes.forEach(cb => {
      if (cb !== checkbox) cb.checked = false;
    });

    if (checkbox.checked) {
      page.setDisponibilidad(checkbox.value);
    } else {
      page.setDisponibilidad('');
    }
  };

  window.enablePrecioFijo = (enabled) => {
    const input = document.getElementById('precioFijoInput');
    input.disabled = !enabled;

    if (!enabled) {
      input.value = '';
      page.setPrecioConsultar();
    }
  };
</script>
</body>
</html>
