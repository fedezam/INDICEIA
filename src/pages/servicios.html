<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Servicios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

<main class="page">

  <h1>Servicios</h1>
  <p class="page-hint">
    Definí qué servicios ofrecés. Con esto alcanza para que la IA los entienda.
  </p>

  <!-- TARJETA SERVICIO -->
  <section class="card">

    <label>
      ¿Qué servicio ofrecés? *
      <input
        type="text"
        placeholder="Ej: Masaje descontracturante"
        oninput="page.setNombre(this.value)"
      />
    </label>

    <label>
      Descripción (opcional)
      <textarea
        placeholder="Detalle breve para el cliente"
        oninput="page.setDescripcion(this.value)"
      ></textarea>
    </label>

    <fieldset>
      <legend>¿Cómo se presta?</legend>

      <label>
        <input type="checkbox" value="presencial" onchange="updateModalidades()" />
        Presencial
      </label>

      <label>
        <input type="checkbox" value="remoto" onchange="updateModalidades()" />
        Remoto
      </label>

      <label>
        <input type="checkbox" value="a_domicilio" onchange="updateModalidades()" />
        A domicilio
      </label>
    </fieldset>

    <fieldset>
      <legend>Precio</legend>

      <label>
        <input
          type="radio"
          name="precio"
          checked
          onchange="page.setPrecioConsultar()"
        />
        Consultar
      </label>

      <label>
        <input
          type="radio"
          name="precio"
          onchange="enablePrecioFijo(true)"
        />
        Precio fijo
      </label>

      <input
        id="precioFijoInput"
        type="number"
        placeholder="Valor"
        disabled
        oninput="page.setPrecioFijo(this.value)"
      />
    </fieldset>

    <fieldset>
      <legend>Disponibilidad</legend>

      <select onchange="page.setDisponibilidad(this.value)">
        <option value="">Seleccionar</option>
        <option value="turno">Requiere coordinación previa</option>
        <option value="reserva">Disponible con agenda</option>
        <option value="consultar">Consultar disponibilidad</option>
      </select>
    </fieldset>

    <label>
      Duración (opcional)
      <input
        type="number"
        placeholder="Minutos"
        oninput="page.setDuracion(this.value)"
      />
    </label>

  </section>

</main>

<!-- BOTÓN GLOBAL (skeleton) -->
<button id="saveChangesBtnBottom">
  Guardar y continuar
</button>

<script type="module">
  import * as page from './servicios.js';
  window.page = page;

  window.updateModalidades = () => {
    const values = Array.from(
      document.querySelectorAll('input[type="checkbox"]:checked')
    ).map(c => c.value);

    page.setModalidadesSeleccionadas(values);
  };

  window.enablePrecioFijo = (enabled) => {
    const input = document.getElementById('precioFijoInput');
    input.disabled = !enabled;
    if (!enabled) input.value = '';
  };
</script>

</body>
</html>
