<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Público - ÍndiceIA</title>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../pages/landing.css" />
  <link rel="stylesheet" href="./link-publico.css" />
</head>
<body>
  <main class="container">
    <section class="public-link-section">
      <h1>Tu link público está listo</h1>
      <p class="info-text">Comparte tu comercio fácilmente con este enlace:</p>
      
      <div class="link-container">
        <input type="text" id="publicUrl" readonly />
        <button id="copyBtn">Copiar</button>
      </div>

      <div class="qr-section">
        <div class="qr-card">
          <h2>QR Pequeño</h2>
          <div id="qr-small" class="qr-box"></div>
          <button onclick="downloadQR('small', 'png')">Descargar PNG</button>
        </div>
        <div class="qr-card">
          <h2>QR Mediano</h2>
          <div id="qr-medium" class="qr-box"></div>
          <button onclick="downloadQR('medium', 'png')">Descargar PNG</button>
        </div>
        <div class="qr-card">
          <h2>QR Grande</h2>
          <div id="qr-large" class="qr-box"></div>
          <button onclick="downloadQR('large', 'png')">Descargar PNG</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script type="module" src="./link-publico.js"></script>
</body>
</html>
