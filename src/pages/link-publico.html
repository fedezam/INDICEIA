<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Link público · ÍndiceIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/shared/global.css" />
  <link rel="stylesheet" href="./link-publico.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Link público</h1>
      <p class="subtitle">
        Este es el acceso directo a tu comercio en ÍndiceIA
      </p>
    </header>

    <!-- LINK -->
    <section class="card link-card">
      <div class="link-box">
        <span id="publicUrl" class="public-url">—</span>
        <button id="copyBtn" class="btn secondary">Copiar</button>
      </div>
    </section>

    <!-- CARTELES -->
    <section class="card">
      <h2>Carteles disponibles</h2>
      <p>Descargá carteles listos para imprimir o compartir en redes</p>
      <div id="carteles" class="carteles-grid"></div>
    </section>
  </main>

  <script type="module" src="./link-publico.js"></script>
</body>
</html>
