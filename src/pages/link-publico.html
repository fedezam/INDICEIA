<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Público - ÍndiceIA</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/pages/landing.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f7f8fa; }
    .container { text-align: center; background: #fff; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { font-size: 1rem; margin-bottom: 2rem; color: #555; }
    #publicUrl { font-weight: bold; color: #0070f3; word-break: break-all; }
    button { background: #0070f3; color: #fff; border: none; padding: 0.8rem 1.6rem; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { background: #005bb5; }
    .toast { position: fixed; top: 20px; right: 20px; background: #4caf50; color: #fff; padding: 1rem 1.5rem; border-radius: 8px; opacity: 0; pointer-events: none; transition: 0.3s; }
    .toast.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tu link público</h1>
    <p id="publicUrl">Cargando...</p>
    <button id="copyBtn">Copiar link</button>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Este script carga el bundle JS que ya incluye todos los imports y Firebase -->
  <script type="module" src="/src/pages/link-publico.js"></script>
</body>
</html>
