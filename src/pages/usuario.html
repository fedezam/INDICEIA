<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Usuario – ÍndiceIA</title>
    <meta name="description" content="Completá tus datos personales para comenzar la configuración de tu asistente ÍndiceIA.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Datos del Usuario – ÍndiceIA">
    <meta property="og:description" content="Completá tu perfil para activar tu asistente inteligente.">
    <meta property="og:image" content="/images/og-image.jpg">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module" src="../controllers/flowController.js"></script>
    <script type="module" src="./usuario.jsx"></script>
</head>

<body>
  <div class="container">
    <!-- TU HEADER ACTUAL -->
    <header class="section-header">
      <h1><i class="fas fa-user"></i> Datos del Usuario</h1>
      <p>Completa tu información personal para continuar con el alta del comercio.</p>
    </header>

    <section class="form-section">
      <form id="userForm">

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre <span class="required">*</span></label>
          <input type="text" id="nombre" required />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="apellido">Apellido <span class="required">*</span></label>
          <input type="text" id="apellido" required />
        </div>

        <!-- ✅ EMAIL (NUEVO) -->
        <div class="form-group">
          <label for="mail">Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="mail" 
            placeholder="tu@email.com" 
            readonly 
            required
            style="background: #f5f5f5; cursor: not-allowed;"
            title="Este email proviene de tu cuenta de Google y no puede modificarse"
          />
        </div>

        <!-- ✅ FECHA DE NACIMIENTO (NUEVO) -->
        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento <span class="required">*</span></label>
          <input type="date" id="fechaNacimiento" required />
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono <span class="required">*</span></label>
          <input type="tel" id="telefono" required />
        </div>

        <!-- ✅ PAÍS (NUEVO) -->
        <div class="form-group">
          <label for="pais">País <span class="required">*</span></label>
          <select id="pais" required>
            <option value="Argentina" selected>🇦🇷 Argentina</option>
          </select>
        </div>

        <!-- Provincia -->
        <div class="form-group">
          <label for="provincia">Provincia <span class="required">*</span></label>
          <select id="provincia" required>
            <option value="">Seleccione provincia</option>
          </select>
        </div>

        <!-- ✅ LOCALIDAD (NUEVO - reemplaza o complementa "Ciudad") -->
        <div class="form-group">
          <label for="localidad">Localidad <span class="required">*</span></label>
          <input type="text" id="localidad" placeholder="Ej: Casilda" required />
        </div>

        <!-- ✅ BARRIO (NUEVO - OPCIONAL) -->
        <div class="form-group">
          <label for="barrio">Barrio (opcional)</label>
          <input type="text" id="barrio" placeholder="Ej: Centro" />
        </div>

        <!-- ✅ DIRECCIÓN (NUEVO) -->
        <div class="form-group">
          <label for="direccion">Dirección <span class="required">*</span></label>
          <input type="text" id="direccion" placeholder="Ej: Catamarca 1219" required />
        </div>

        <!-- ¿Es comercio o servicio? -->
        <div class="form-group">
          <label>Tipo de actividad <span class="required">*</span></label>

          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="checkComercio" />
              Comercio
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="checkServicio" />
              Servicio
            </label>
          </div>
        </div>

        <!-- Botón Guardar -->
        <div class="btn-group btn-group-end">
          <button type="button" id="saveUserData" class="btn btn-primary btn-lg">
            <i class="fas fa-save"></i> Guardar Datos
          </button>
        </div>

        <!-- ✅ SECCIÓN DE OPCIONES DE IA (NUEVA) -->
        <div class="form-group" style="margin-top: 40px;">
          <p style="background: rgba(102, 126, 234, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #333;">
            ⚡ Una vez guardados tus datos, elige qué tipo de IA deseas crear:
          </p>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <button 
              type="button" 
              id="btnComercio" 
              class="btn btn-secondary" 
              disabled 
              style="background: #e0e0e0; cursor: not-allowed; padding: 25px; height: auto; display: flex; flex-direction: column; align-items: center; text-align: center;"
            >
              <i class="fas fa-store" style="font-size: 32px; margin-bottom: 10px;"></i>
              <strong style="font-size: 16px; margin-bottom: 5px;">Crear IA para Comercio</strong>
              <span style="font-size: 13px; color: #666;">Ideal si vendes productos, con catálogo y horarios.</span>
            </button>
            
            <button 
              type="button" 
              id="btnServicio" 
              class="btn btn-secondary" 
              disabled 
              style="background: #e0e0e0; cursor: not-allowed; padding: 25px; height: auto; display: flex; flex-direction: column; align-items: center; text-align: center;"
            >
              <i class="fas fa-briefcase" style="font-size: 32px; margin-bottom: 10px;"></i>
              <strong style="font-size: 16px; margin-bottom: 5px;">Crear IA para Servicio</strong>
              <span style="font-size: 13px; color: #666;">Perfecto si ofrecés servicios o turnos personalizados.</span>
            </button>
          </div>
        </div>

      </form>
    </section>
  </div>

  <script type="module" src="/src/controllers/flowController.js"></script>
  <!-- ✅ Scripts adicionales necesarios -->
  <script type="module" src="../firebase.js"></script>
  <script type="module" src="../shared/provincias.js"></script>

</body>
</html>
