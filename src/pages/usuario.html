<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Datos personales | ÍndiceIA</title>

  <link rel="stylesheet" href="./usuario.css" />
</head>
<body>

  <main class="main-content usuario-page">

    <header class="header">
      <h1>Datos personales</h1>
      <p>Completá tus datos para continuar con la creación de tu entidad</p>
    </header>

    <form class="form">

      <div class="form-row">
        <label>Nombre</label>
        <input id="nombre" type="text" />
      </div>

      <div class="form-row">
        <label>Apellido</label>
        <input id="apellido" type="text" />
      </div>

      <div class="form-row">
        <label>Email</label>
        <input id="mail" type="email" disabled />
      </div>

      <div class="form-row">
        <label>Fecha de nacimiento</label>
        <input id="fechaNacimiento" type="text" placeholder="DD/MM/AAAA" />
      </div>

      <div class="form-row">
        <label>Teléfono</label>
        <input id="telefono" type="tel" />
      </div>

      <div class="form-row">
        <label>País</label>
        <input id="pais" type="text" />
      </div>

      <div class="form-row">
        <label>Provincia</label>
        <select id="provincia"></select>
      </div>

      <div class="form-row">
        <label>Localidad</label>
        <input id="localidad" type="text" />
      </div>

      <div class="form-row">
        <label>Barrio</label>
        <input id="barrio" type="text" />
      </div>

      <div class="form-row">
        <label>Dirección</label>
        <input id="direccion" type="text" />
      </div>

      <button id="saveUserData" class="btn btn-primary" disabled>
        Guardar y continuar
      </button>

    </form>

  </main>

  <script type="module" src="./usuario.js"></script>
</body>
</html>
