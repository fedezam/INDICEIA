<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completa tu perfil</title>
</head>
<body>

  <div class="container">
    <h1>Completa tu información</h1>
    <p>Obligatorio para continuar</p>

    <form id="profileForm">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nombre" disabled>
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input type="text" id="apellido" disabled>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="mail" disabled>
      </div>

      <div class="form-group">
        <label>Fecha de nacimiento (DD/MM/AAAA)</label>
        <input type="text" id="fechaNacimiento" placeholder="DD/MM/AAAA">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="telefono">
      </div>

      <div class="form-group">
        <label>País</label>
        <input type="text" id="pais" value="Argentina" disabled>
      </div>

      <div class="form-group">
        <label>Provincia</label>
        <select id="provincia">
          <option value="">Selecciona una provincia</option>
        </select>
      </div>

      <div class="form-group">
        <label>Localidad</label>
        <input type="text" id="localidad">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="direccion">
      </div>

      <div class="form-group">
        <label>Barrio (opcional)</label>
        <input type="text" id="barrio">
      </div>

      <button type="button" id="saveUserData" disabled>Guardar y continuar</button>
    </form>
  </div>

  <script type="module" src="./usuario.js"></script>
</body>
</html>
