<!-- src/pages/usuario.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuario — Paso 1</title>
  <link rel="stylesheet" href="./usuario.css" />
</head>
<body>
  <main class="main-content">
    <h1>Datos Personales</h1>
    <form id="usuarioForm">
      <label>Nombre</label>
      <input type="text" id="nombre" disabled />

      <label>Apellido</label>
      <input type="text" id="apellido" disabled />

      <label>Email</label>
      <input type="email" id="mail" disabled />

      <label>Fecha de Nacimiento</label>
      <input type="text" id="fechaNacimiento" placeholder="DD/MM/AAAA" />

      <label>Teléfono</label>
      <input type="text" id="telefono" />

      <label>País</label>
      <select id="pais" disabled>
        <option value="Argentina">Argentina</option>
      </select>

      <label>Provincia</label>
      <select id="provincia"></select>

      <label>Localidad</label>
      <input type="text" id="localidad" />

      <label>Barrio</label>
      <input type="text" id="barrio" />

      <label>Dirección</label>
      <input type="text" id="direccion" />

      <button type="button" id="saveUserData" disabled>Guardar y continuar</button>
    </form>
  </main>

  <script type="module" src="./usuario.js"></script>
</body>
</html>
