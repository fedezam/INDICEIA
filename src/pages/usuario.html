<body class="usuario-page">
  <div class="container">
    <div class="main-content">

      <h1 class="title">
        <i class="fas fa-user"></i> Datos del Usuario
      </h1>
      <p class="subtitle">
        Completa tu información personal para continuar con el alta del comercio.
      </p>

      <section class="form-section">
        <h3><i class="fas fa-id-card"></i> Información Personal</h3>

        <div class="form-fields">

          <div class="form-field">
            <label for="nombre">Nombre <span class="required"></span></label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-field">
            <label for="apellido">Apellido <span class="required"></span></label>
            <input type="text" id="apellido" required>
          </div>

          <div class="form-field">
            <label for="mail">Email</label>
            <input type="email" id="mail" readonly>
          </div>

          <div class="form-field">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento">
          </div>

          <div class="form-field">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono">
          </div>

          <div class="form-field">
            <label for="pais">País</label>
            <select id="pais">
              <option value="Argentina">Argentina</option>
            </select>
          </div>

          <div class="form-field">
            <label for="provincia">Provincia</label>
            <select id="provincia">
              <option value="">Seleccione provincia</option>
            </select>
          </div>

          <div class="form-field">
            <label for="localidad">Localidad</label>
            <input type="text" id="localidad">
          </div>

          <div class="form-field">
            <label for="barrio">Barrio</label>
            <input type="text" id="barrio">
          </div>

          <div class="form-field">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion">
          </div>

          <div class="form-field">
            <label>Tipo de Actividad</label>
            <div class="checkbox-grid">
              <label class="checkbox-item">
                <input type="checkbox" id="checkComercio"> Comercio
              </label>

              <label class="checkbox-item">
                <input type="checkbox" id="checkServicio"> Servicio
              </label>
            </div>
          </div>

        </div>

        <div class="btn-group btn-group-end">
          <button id="saveUserData" class="btn btn-primary btn-lg" type="button">
            <i class="fas fa-save"></i> Guardar Datos
          </button>
        </div>

        <p class="info-text">⚡ Una vez guardados tus datos, elige qué tipo de IA deseas crear:</p>

        <div class="options">

          <button id="btnComercio" class="btn ia-btn" disabled>
            <i class="fas fa-store"></i>
            <strong>Crear IA para Comercio</strong>
            <p class="btn-desc">Categorías + catálogo de productos.</p>
          </button>

          <button id="btnServicio" class="btn ia-btn" disabled>
            <i class="fas fa-briefcase"></i>
            <strong>Crear IA para Servicio</strong>
            <p class="btn-desc">Turnos + agenda + consultas.</p>
          </button>

        </div>

        <div class="logout-section">
          <button class="btn btn-secondary" id="btnLogout" type="button">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
          </button>
        </div>

      </section>

    </div>
  </div>

  <script type="module" src="./usuario.jsx"></script>
</body>
