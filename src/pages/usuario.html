<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Usuario – ÍndiceIA</title>
    <meta name="description" content="Completá tus datos personales para comenzar la configuración de tu asistente ÍndiceIA.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Datos del Usuario – ÍndiceIA">
    <meta property="og:description" content="Completá tu perfil para activar tu asistente inteligente.">
    <meta property="og:image" content="/images/og-image.jpg">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module" src="../controllers/flowController.js"></script>
    <script type="module" src="./usuario.jsx"></script>
</head>

<body>
  <div class="container">
    <header class="section-header">
      <h1><i class="fas fa-user"></i> Datos del Usuario</h1>
      <p>Completa tu información personal para continuar con el alta del comercio.</p>
    </header>

    <section class="form-section">
      <form id="userForm">

        <div class="form-group">
          <label for="nombre">Nombre <span class="required">*</span></label>
          <input type="text" id="nombre" required />
        </div>

        <div class="form-group">
          <label for="apellido">Apellido <span class="required">*</span></label>
          <input type="text" id="apellido" required />
        </div>

        <div class="form-group">
          <label for="mail">Email <span class="required">*</span></label>
          <input type="email" id="mail" readonly required />
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento <span class="required">*</span></label>
          <input type="date" id="fechaNacimiento" required />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono <span class="required">*</span></label>
          <input type="tel" id="telefono" required />
        </div>

        <div class="form-group">
          <label for="pais">País <span class="required">*</span></label>
          <select id="pais" required>
            <option value="Argentina">Argentina</option>
          </select>
        </div>

        <div class="form-group">
          <label for="provincia">Provincia <span class="required">*</span></label>
          <select id="provincia" required>
            <option value="">Seleccione provincia</option>
          </select>
        </div>

        <div class="form-group">
          <label for="localidad">Localidad <span class="required">*</span></label>
          <input type="text" id="localidad" required />
        </div>

        <div class="form-group">
          <label for="barrio">Barrio (opcional)</label>
          <input type="text" id="barrio" />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección <span class="required">*</span></label>
          <input type="text" id="direccion" required />
        </div>

        <div class="form-group">
          <label>Tipo de actividad</label>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="checkComercio" /> Comercio
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="checkServicio" /> Servicio
            </label>
          </div>
        </div>

        <div class="btn-group btn-group-end">
          <button type="button" id="saveUserData" class="btn btn-primary btn-lg">
            <i class="fas fa-save"></i> Guardar Datos
          </button>
        </div>

        <div class="form-group" style="margin-top: 40px;">
          <p style="background: rgba(102, 126, 234, 0.1); padding: 15px; border-radius: 8px;">⚡ Una vez guardados tus datos, elige qué tipo de IA deseas crear:</p>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <button id="btnComercio" type="button" class="btn btn-secondary" disabled>Crear IA para Comercio</button>

            <button id="btnServicio" type="button" class="btn btn-secondary" disabled>Crear IA para Servicio</button>
          </div>
        </div>

      </form>
    </section>
  </div>

  <script type="module" src="/src/pages/usuario.jsx"></script>
</body>
</html>
