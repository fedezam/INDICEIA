<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datos Personales</title>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/forms.css" />
  <link rel="stylesheet" href="./usuario.css" />
</head>
<body>
  <div class="main-content">
    <h1>Datos Personales</h1>
    <form id="usuarioForm" autocomplete="off">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" placeholder="Tu nombre" required />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input id="apellido" type="text" placeholder="Tu apellido" required />
      </div>

      <div class="form-group">
        <label for="mail">Email</label>
        <input id="mail" type="email" disabled placeholder="tuemail@ejemplo.com" />
      </div>

      <div class="form-group">
        <label for="fechaNacimiento">Fecha de Nacimiento</label>
        <input id="fechaNacimiento" type="text" placeholder="DD/MM/AAAA" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="text" placeholder="Ej: +541112345678" required />
      </div>

      <div class="form-group">
        <label for="pais">País</label>
        <input id="pais" type="text" value="Argentina" required />
      </div>

      <div class="form-group">
        <label for="provincia">Provincia</label>
        <select id="provincia" required>
          <option value="">Seleccionar...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="localidad">Localidad</label>
        <input id="localidad" type="text" required />
      </div>

      <div class="form-group">
        <label for="barrio">Barrio</label>
        <input id="barrio" type="text" />
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input id="direccion" type="text" required />
      </div>

      <button id="saveUserData" type="button" class="btn btn-primary" disabled>Guardar y continuar</button>
    </form>
  </div>

  <script type="module" src="./usuario.js"></script>
</body>
</html>
