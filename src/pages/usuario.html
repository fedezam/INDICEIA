<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datos del Usuario - Índice IA</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />

  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>
  <div class="container">
    <header class="section-header">
      <h1><i class="fas fa-user"></i> Datos del Usuario</h1>
      <p>Completa tu información personal para continuar con el alta del comercio.</p>
    </header>

    <section class="form-section">
      <form id="userForm">

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre <span class="required">*</span></label>
          <input type="text" id="nombre" required />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="apellido">Apellido <span class="required">*</span></label>
          <input type="text" id="apellido" required />
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono <span class="required">*</span></label>
          <input type="tel" id="telefono" required />
        </div>

        <!-- Provincia -->
        <div class="form-group">
          <label for="provincia">Provincia <span class="required">*</span></label>
          <select id="provincia" required>
            <option value="">Seleccione provincia</option>
          </select>
        </div>

        <!-- Ciudad -->
        <div class="form-group">
          <label for="ciudad">Ciudad <span class="required">*</span></label>
          <select id="ciudad" required>
            <option value="">Seleccione ciudad</option>
          </select>
        </div>

        <!-- ¿Es comercio o servicio? -->
        <div class="form-group">
          <label>Tipo de actividad <span class="required">*</span></label>

          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="checkComercio" />
              Comercio
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="checkServicio" />
              Servicio
            </label>
          </div>
        </div>

        <!-- Botón Guardar -->
        <div class="btn-group btn-group-end">
          <button type="button" id="saveUserData" class="btn btn-primary btn-lg">
            <i class="fas fa-save"></i> Guardar Datos
          </button>
        </div>

        <!-- Botón Siguiente (NUEVO) -->
        <div class="btn-group btn-group-end" style="margin-top: 15px;">
          <button 
            type="button" 
            id="btnSiguiente" 
            class="btn btn-secondary btn-lg" 
            disabled 
            style="opacity: 0.5; cursor: not-allowed;"
          >
            <i class="fas fa-arrow-right"></i> Siguiente
          </button>
        </div>

      </form>
    </section>
  </div>

  <script type="module" src="/controllers/usuario.js"></script>

</body>
</html>
