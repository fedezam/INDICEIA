<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completa tu perfil</title>
</head>
<body>

  <div class="container">
    <h1>Completa tu información</h1>
    <p>Estos datos son obligatorios para continuar</p>

    <!-- Formulario -->
    <form id="profileForm">

      <div>
        <label>Nombre</label>
        <input type="text" id="nombre" disabled>
      </div>

      <div>
        <label>Apellido</label>
        <input type="text" id="apellido" disabled>
      </div>

      <div>
        <label>Email</label>
        <input type="email" id="mail" disabled>
      </div>

      <div>
        <label>Fecha de nacimiento (DD/MM/AAAA)</label>
        <input type="text" id="fechaNacimiento">
      </div>

      <div>
        <label>Teléfono</label>
        <input type="tel" id="telefono">
      </div>

      <div>
        <label>País</label>
        <input type="text" id="pais" value="Argentina" disabled>
      </div>

      <div>
        <label>Provincia</label>
        <select id="provincia">
          <option value="">Selecciona una provincia</option>
        </select>
      </div>

      <div>
        <label>Localidad</label>
        <input type="text" id="localidad">
      </div>

      <div>
        <label>Dirección</label>
        <input type="text" id="direccion">
      </div>

      <div>
        <label>Barrio (opcional)</label>
        <input type="text" id="barrio">
      </div>

      <button type="button" id="saveUserData" disabled>Guardar</button>
    </form>
  </div>

  <!-- Logs simples directamente en HTML para ver qué existe -->
  <script>
    console.log("HTML cargado - momento:", new Date().toLocaleString());

    window.addEventListener('DOMContentLoaded', () => {
      console.log("DOM listo - buscando elementos:");

      const elementos = [
        "nombre", "apellido", "mail", "fechaNacimiento", "telefono",
        "pais", "provincia", "localidad", "direccion", "barrio", "saveUserData"
      ];

      elementos.forEach(id => {
        const el = document.getElementById(id);
        console.log(`  → #${id}: ${el ? 'EXISTE' : 'NO EXISTE'}`);
        if (el) {
          console.log(`     valor actual: "${el.value || el.textContent || '(vacío)'}"`);
          if (el.tagName === 'SELECT') {
            console.log(`     opciones en provincia: ${el.options.length}`);
          }
        }
      });
    });
  </script>

  <!-- Tu script principal (el que ya tenías) -->
  <script type="module" src="./usuario.js"></script>
</body>
</html>
