<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completa tu perfil - Primer paso</title>
</head>
<body>

  <div class="container">
    <header>
      <h1>Completa tu información</h1>
      <p>Estos datos son obligatorios para continuar</p>
    </header>

    <form id="profileForm" class="profile-form">

      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input type="text" id="nombre" disabled required>
      </div>

      <div class="form-group">
        <label for="apellido">Apellido *</label>
        <input type="text" id="apellido" disabled required>
      </div>

      <div class="form-group">
        <label for="mail">Email *</label>
        <input type="email" id="mail" disabled required>
      </div>

      <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento * (DD/MM/AAAA)</label>
        <input type="text" id="fechaNacimiento" placeholder="DD/MM/AAAA" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono *</label>
        <input type="tel" id="telefono" required>
      </div>

      <div class="form-group">
        <label for="pais">País *</label>
        <input type="text" id="pais" value="Argentina" disabled required>
      </div>

      <div class="form-group">
        <label for="provincia">Provincia *</label>
        <select id="provincia" required>
          <option value="">Selecciona una provincia</option>
          <!-- Las opciones se llenan desde JS -->
        </select>
      </div>

      <div class="form-group">
        <label for="localidad">Localidad *</label>
        <input type="text" id="localidad" required>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección *</label>
        <input type="text" id="direccion" required>
      </div>

      <div class="form-group">
        <label for="barrio">Barrio (opcional)</label>
        <input type="text" id="barrio">
      </div>

      <div class="form-actions">
        <button type="button" id="saveUserData" disabled>
          Guardar y continuar
        </button>
      </div>

    </form>
  </div>

  <script type="module" src="./usuario.js"></script>
</body>
</html>
