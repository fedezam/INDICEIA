<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Configura tu comercio en INDICEIA - Asistente IA para negocios">
  <title>Mi Comercio - INDICEIA</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS GLOBALES (en orden de importancia) -->
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/forms.css">
  
  <!-- CSS ESPECÍFICO DE ESTA PÁGINA -->
  <link rel="stylesheet" href="/src/pages/mi-comercio.css">
</head>

<body>
  <!-- 
    ============================================
    NOTA: El contenido del layout (header, banner, progress) 
    será insertado dinámicamente por layout.js
    ============================================
  -->

  <!-- El main-content también será generado por mi-comercio.js -->

  <!-- Toast Container (para notificaciones) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Loading Overlay (para estados de carga) -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Cargando...</p>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // Configuración de Firebase (ajusta según tu proyecto)
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Hacer disponible globalmente (opcional)
    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseDB = db;
  </script>

  <!-- JavaScript Principal de la Página -->
  <script type="module" src="/src/pages/mi-comercio.js"></script>

  <!-- 
    ============================================
    ESTRUCTURA ESPERADA DESPUÉS DE CARGAR:
    ============================================
    
    <header class="header">
      <div class="container">
        <div class="logo">...</div>
        <div class="user-info">...</div>
      </div>
    </header>
    
    <div class="subscription-banner">...</div>
    
    <div id="progressContainer">
      <div class="onboarding-progress">...</div>
    </div>
    
    <main class="main-content">
      <div class="ai-helper-section">...</div>
      <form id="commerceForm">...</form>
      <div class="bottom-action-bar">...</div>
    </main>
    
    ============================================
  -->

</body>
</html>
