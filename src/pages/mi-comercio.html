<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Comercio – ÍndiceIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="./mi-comercio.css">
</head>
<body>
    <!-- Header, Navigation y Banner se renderizan desde layout.js -->

    <main class="container">
        <h2 class="section-title">Información del Comercio</h2>

        <!-- Selector de Plan -->
        <h3 class="subsection-title">Selecciona tu Plan</h3>
        <div id="planSelector" class="plan-selector"></div>

        <!-- Formulario de datos del comercio -->
        <form id="miComercioForm" class="form-fields">
            
            <label for="nombreComercio">Nombre Comercial *</label>
            <input type="text" id="nombreComercio" name="nombreComercio" required>

            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" name="descripcion" required rows="3"></textarea>

            <label for="rubro">Rubro *</label>
            <select id="rubro" name="rubro" required>
                <option value="">Seleccionar…</option>
                <option value="almacen">Almacén</option>
                <option value="restaurante">Restaurante</option>
                <option value="kiosco">Kiosco</option>
                <option value="estetica">Estética</option>
                <option value="servicios">Servicios</option>
                <option value="otro">Otro</option>
            </select>

            <label for="pais">País</label>
            <input type="text" id="pais" name="pais" value="Argentina" disabled>

            <label for="provincia">Provincia *</label>
            <select id="provincia" name="provincia" required></select>

            <label for="ciudad">Ciudad / Localidad *</label>
            <input type="text" id="ciudad" name="ciudad" required>

            <label for="barrio">Barrio (opcional)</label>
            <input type="text" id="barrio" name="barrio">

            <label for="direccion">Dirección *</label>
            <input type="text" id="direccion" name="direccion" required>

            <label for="telefono">Teléfono *</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>

            <!-- Presencia Web -->
            <h3 class="subsection-title">Presencia Web (al menos una)</h3>
            
            <label for="website">Sitio Web</label>
            <input type="url" id="website" name="website" placeholder="https://">

            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" name="whatsapp" placeholder="+54 9 11 1234 5678">

            <label for="instagram">Instagram</label>
            <input type="text" id="instagram" name="instagram" placeholder="@micomercio">

            <label for="facebook">Facebook</label>
            <input type="text" id="facebook" name="facebook" placeholder="@micomercio">

            <label for="tiktok">TikTok</label>
            <input type="text" id="tiktok" name="tiktok" placeholder="@micomercio">

            <button type="submit" id="guardarBtn" class="primary-btn">Guardar Datos</button>

            <div id="saveAnimation" class="save-animation" style="display: none;">
                Guardando…
            </div>
        </form>

        <!-- Categorías -->
        <h3 class="subsection-title">Categorías de tu Negocio</h3>
        <div id="categoriesGrid" class="categories-section"></div>

        <!-- Métodos de Pago -->
        <h3 class="subsection-title">Métodos de Pago</h3>
        <div id="paymentMethods" class="checkbox-list"></div>

    </main>

    <script type="module" src="./mi-comercio.js"></script>
</body>
</html>
