<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Productos</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-left">
      <img src="/img/logo.svg" alt="Logo" class="logo">
      <h1>Panel de Comercio</h1>
    </div>
    <div class="header-right">
      <span id="userEmail" class="user-email"></span>
      <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <!-- ================= LAYOUT ================= -->
  <div class="layout">
    <!-- ======= NAV ======= -->
    <nav class="sidebar">
      <ul>
        <li><a href="/src/pages/usuario.html">👤 Mi Perfil</a></li>
        <li><a href="/src/pages/mi-comercio.html">🏪 Mi Comercio</a></li>
        <li><a href="/src/pages/productos.html" class="active">🧾 Productos</a></li>
        <li><a href="/src/pages/servicio.html">🛠️ Servicios</a></li>
      </ul>
    </nav>

    <!-- ======= MAIN ======= -->
    <main class="content">
      <section class="panel">
        <h2>📦 Gestión de Productos</h2>

        <!-- Formulario -->
        <form id="productForm" class="form">
          <input id="nombre" placeholder="Nombre del producto" required>
          <input id="precio" type="number" placeholder="Precio" required>
          <input id="origen" placeholder="Origen (opcional)">
          <input id="imagen" type="url" placeholder="URL de imagen (opcional)">
          <button type="submit" id="saveProduct">Guardar Producto</button>
        </form>

        <!-- Botones CSV -->
        <div class="csv-section">
          <input type="file" id="csvInput" accept=".csv">
          <button id="previewCsv">Previsualizar CSV</button>
          <button id="importCsv">Importar CSV</button>
        </div>

        <!-- Tabla -->
        <table id="productTable">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Origen</th>
              <th>Imagen</th>
              <th>Pausado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productList"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="/src/firebase.js"></script>
  <script type="module" src="/src/pages/productos.js"></script>
</body>
</html>
