<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Tu Comercio</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="./productos.css">

  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header id="layout-header"></header>

<main>
  <div class="container">

    <div class="page-header">
      <h1><i class="fas fa-box"></i> Catálogo de Productos</h1>
      <p>Cargá tus productos manualmente o importá desde Excel/CSV</p>
      <div class="product-stats">
        <span class="stat-badge">
          <i class="fas fa-boxes"></i>
          <strong id="productCount">0</strong> productos
        </span>
      </div>
    </div>

    <div id="initialLoading" class="loading-hint">
      <i class="fas fa-spinner fa-spin"></i>
      Cargando catálogo…
    </div>

    <div id="productsTable" class="form-section">

      <div class="table-header">
        <h3><i class="fas fa-table"></i> Productos Cargados</h3>
        <div class="table-actions">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchProducts" placeholder="Buscar productos...">
          </div>
        </div>
      </div>

      <div class="table-container">
        <table class="products-table">
          <thead>
            <tr>
              <th class="col-check">
                <input type="checkbox" id="checkAll">
              </th>
              <th class="col-code">Código</th>
              <th class="col-name">Nombre</th>
              <th class="col-price">Precio</th>
              <th class="col-stock">Stock</th>
              <th class="col-category">Categoría</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div id="emptyMessage" class="empty-state" style="display:none">
          <i class="fas fa-box-open"></i>
          <p>Aún no tenés productos cargados</p>
          <small>Agregá productos manualmente o importá desde Excel</small>
        </div>
      </div>
    </div>

    <div class="bottom-action-bar">
      <button id="saveChangesBtnBottom" class="btn btn-primary btn-save" disabled>
        Guardar cambios
      </button>
    </div>

  </div>
</main>

<footer id="layout-footer"></footer>

<script type="module" src="./productos.js"></script>
</body>
</html>
