<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios - INDICEIA</title>
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  
  <style>
    .subscription-banner {
      background: #fffbeb;
      border-left: 4px solid #f6ad55;
      padding: 1rem 2rem;
      margin: 1rem 0;
      font-weight: 600;
      color: #975a16;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subscription-banner.expired {
      background: #fed7d7;
      border-left-color: #e53e3e;
      color: #9b2c2c;
    }
    .subscription-banner.active {
      background: #c6f6d5;
      border-left-color: #38a169;
      color: #276749;
    }
    .subscription-banner.trial {
      background: #e0e7ff;
      border-left-color: #667eea;
      color: #434190;
    }

    /* Estilos específicos para horarios */
    .schedule-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .schedule-day {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.25rem;
      background: #fff;
    }
    .day-header {
      margin-bottom: 1rem;
    }
    .day-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
    }
    .day-toggle input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
    }
    .day-hours.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .schedule-mode {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .schedule-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .time-blocks {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .morning-hours,
    .afternoon-hours {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .time-range {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .time-range input[type="time"] {
      width: auto;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .time-range span {
      color: #64748b;
      font-weight: 500;
    }
    label {
      font-weight: 600;
      color: #334155;
    }

    /* Clase de respaldo para ocultar bloques */
    .hidden {
      display: none !important;
    }

    /* Estilos del botón de guardar (inserción dinámica) */
    .header .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-save {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #667eea;
      color: white;
      white-space: nowrap;
    }
    .btn-save:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-save:not(:disabled):hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-save.saving {
      background: #f59e0b;
    }
    .btn-save.saved {
      background: #10b981;
    }
    .btn-save i {
      font-size: 1rem;
    }
    .btn-save.saving i {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Cargando...</div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-robot"></i>
        </div>
        <h1>INDICEIA</h1>
      </div>
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="commerceName">Cargando...</div>
          <div class="user-email" id="planBadge">Trial</div>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Subscription Banner -->
  <div class="subscription-banner" id="subscriptionBanner">
    <i class="fas fa-info-circle"></i>
    <span id="subscriptionMessage">Cargando estado de suscripción...</span>
  </div>

  <!-- Progress bar -->
  <div class="progress-indicator" id="progressContainer"></div>

  <!-- Contenido principal -->
  <main class="main-content">
    <div class="container">
      <div class="form-section">
        <h3><i class="fas fa-clock"></i> Horarios de Atención</h3>
        <p>Configura los horarios en que tu comercio está disponible para atender consultas.</p>
        
        <div class="schedule-grid" id="scheduleGrid"></div>
      </div>
    </div>
  </main>

  <!-- Navegación -->
  <div class="navigation-controls" id="navigationControls"></div>

  <!-- Scripts -->
  <script type="module" src="./horarios.jsx"></script>
</body>
</html>
