<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horarios – ÍndiceIA</title>

    <!-- Estilos exclusivos del módulo horarios -->
    <link rel="stylesheet" href="horarios.css" />

    <!-- Firebase -->
    <script type="module" src="firebase-init.js"></script>

    <!-- Flow Controller -->
    <script type="module" src="src/controllers/flowController.js"></script>

    <!-- Script principal de esta página -->
    <script type="module" src="horarios.js"></script>
</head>

<body>

    <!-- HEADER igual a mi-comercio -->
    <header class="top-header">
        <div class="header-content">
            <h1 class="page-title">Horarios Comerciales</h1>
            <p class="page-subtitle">Configura los días y rangos horarios de atención.</p>
        </div>
    </header>

    <!-- CONTENEDOR GENERAL -->
    <main class="page-container">

        <!-- GRID DE HORARIOS (dinámico por JS) -->
        <section id="horarios-grid" class="horarios-grid"></section>

        <!-- BOTONES (idénticos a mi-comercio) -->
        <div class="form-navigation">
            <button id="btnBack" class="btn btn-secondary">← Volver</button>
            <button id="btnSave" class="btn btn-primary">Guardar y continuar →</button>
        </div>

        <!-- ANIMACIÓN DE GUARDADO -->
        <div id="savingOverlay" class="saving-overlay hidden">
            <div class="saving-box">
                <div class="loader"></div>
                <p>Guardando…</p>
            </div>
        </div>

    </main>

</body>

</html>
