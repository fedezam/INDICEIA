<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horarios – ÍndiceIA</title>
    <meta name="description" content="Configurá los horarios de atención de tu comercio o servicio.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Horarios – ÍndiceIA">
    <meta property="og:description" content="Configura tus horarios para tu asistente IA.">
    <meta property="og:image" content="/images/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/src/styles/global.css">

    <script type="module" src="../shared/flowController.js"></script>

</head>

<body>
  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Cargando...</div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-robot"></i>
        </div>
        <h1>INDICEIA</h1>
      </div>
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="commerceName">Cargando...</div>
          <div class="user-email" id="planBadge">Trial</div>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Subscription Banner -->
  <div class="subscription-banner" id="subscriptionBanner">
    <i class="fas fa-info-circle"></i>
    <span id="subscriptionMessage">Cargando estado de suscripción...</span>
  </div>

  <!-- Progress bar -->
  <div class="progress-indicator" id="progressContainer"></div>

  <!-- Contenido principal -->
  <main class="main-content">
    <div class="container">
      <div class="form-section">
        <h3><i class="fas fa-clock"></i> Horarios de Atención</h3>
        <p>Configura los horarios en que tu comercio está disponible para atender consultas.</p>
        
        <div class="schedule-grid" id="scheduleGrid"></div>
      </div>
    </div>
  </main>

  <!-- Navegación -->
  <div class="navigation-controls" id="navigationControls"></div>

  <!-- Scripts -->
  <script type="module" src="./horarios.jsx"></script>
</body>
</html>
