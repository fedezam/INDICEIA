<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios - Mi Comercio IA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- El header, banner y barra de progreso se renderizan desde layout.js -->
  
  <main>
    <div class="container">
      <!-- Card de ayuda IA se inserta aquí desde JS -->
      
      <div class="page-header">
        <h2>⏰ Horarios de Atención</h2>
        <p>Configurá los días y horarios en que tu negocio atiende</p>
      </div>

      <!-- Grid de horarios -->
      <div id="scheduleGrid" class="schedule-grid">
        <!-- Los días se renderizan desde renderScheduleForm() -->
      </div>

      <!-- Botón de guardar inferior -->
      <button type="button" id="saveChangesBtnBottom" class="btn-primary btn-save-bottom" disabled>
        Guardar Cambios
      </button>
    </div>
  </main>

  <script type="module" src="./horarios.js"></script>
</body>
</html>
