<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Horarios – ÍndiceIA</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/forms.css">

  <!-- CSS específico de horarios -->
  <link rel="stylesheet" href="/src/pages/horarios.css">

  <!-- JS de la página -->
  <script type="module" src="/src/pages/horarios.js"></script>

  <!-- Necesario para header / navegación / flujo -->
  <script type="module" src="/src/shared/layout.js"></script>
  <script type="module" src="/src/shared/navigation.js"></script>
  <script type="module" src="/src/controllers/flowController.js"></script>
</head>

<body data-page="horarios">

  <!-- HEADER -->
  <header id="layout-header"></header>

  <!-- BANNER DE PLAN -->
  <div id="subscriptionBanner"></div>

  <!-- PROGRESO Y NAVEGACIÓN -->
  <div id="navigationControls"></div>

  <main>
    <div class="container">

      <div class="form-section">

        <h2 class="section-title"><i class="fas fa-clock"></i> Horarios de Atención</h2>
        <p>Definí los horarios en que tu comercio está disponible.</p>

        <div id="scheduleGrid" class="schedule-grid"></div>

      </div>

    </div>
  </main>

  <!-- BOTÓN FIJO ABAJO -->
  <div class="bottom-action">
    <button id="saveChangesBtnBottom" disabled>Guardar Cambios</button>
  </div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Cargando...</div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
