<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | IA Comercial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../styles.css"/>
  <script type="module" src="../src/pages/dashboard.jsx" defer></script>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h1>IA Comercial</h1>
      </div>
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="commerceName">Cargando...</div>
          <div class="user-email" id="planBadge">Trial</div>
        </div>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </header>

  <!-- NAVBAR -->
  <div id="dashboardNavbar" class="container" style="margin: 2rem auto;"></div>

  <!-- ALERTA PLAN -->
  <div id="planAlert" class="container"></div>

  <!-- CHECKLIST -->
  <div id="checklistSection" class="container"></div>

  <!-- ESTADÍSTICAS -->
  <div id="statsSection" class="container" style="margin: 2rem 0;"></div>

  <!-- ASISTENTE IA -->
  <div id="aiCard" class="container" style="margin: 2rem 0;"></div>

  <!-- RESUMEN -->
  <div id="summaryGrid" class="container grid-4" style="display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));"></div>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- LOADING -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Cargando dashboard...</div>
  </div>
</body>
</html>
