<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – ÍndiceIA</title>
    <meta name="description" content="Panel central para gestionar tu comercio, IA, catálogo y configuración general.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dashboard – ÍndiceIA">
    <meta property="og:description" content="Panel principal de tu asistente comercial inteligente.">
    <meta property="og:image" content="/images/og-image.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="../controllers/flowController.js"></script>
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h1>IA Comercial</h1>
      </div>
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="commerceName">Cargando...</div>
          <div class="user-email" id="planBadge">Trial</div>
        </div>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </header>

  <!-- NAVBAR -->
  <div id="dashboardNavbar" class="container" style="margin: 2rem auto;"></div>

  <!-- ALERTA PLAN -->
  <div id="planAlert" class="container"></div>

  <!-- CHECKLIST -->
  <div id="checklistSection" class="container"></div>

  <!-- ESTADÍSTICAS -->
  <div id="statsSection" class="container" style="margin: 2rem 0;"></div>

  <!-- ASISTENTE IA -->
  <div id="aiCard" class="container" style="margin: 2rem 0;"></div>

  <!-- RESUMEN -->
  <div id="summaryGrid" class="container grid-4" style="display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));"></div>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- LOADING -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Cargando dashboard...</div>
  </div>
</body>
</html>
