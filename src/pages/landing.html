<!DOCTYPE html>
<html lang="es">
<head>

  <!-- Estilos base del proyecto -->

<body>

  <main class="landing-container">

    <!-- LOGO / IDENTIDAD -->

      <img
        id="landingLogo"
        class="landing-logo"
        src=""

    <!-- CONTENIDO PRINCIPAL -->
    <section class="landing-content">
      <h1 id="landingTitle">Cargando…</h1>

      <button id="ctaButton" class="btn btn-primary btn-lg" disabled>

    <!-- DISCLAIMER -->
    <section class="landing-disclaimer">
      <p>
        Estás por interactuar con una inteligencia artificial configurada
        exclusivamente por este comercio.
      </p>
      <p>
        ÍndiceIA no controla ni supervisa las respuestas generadas.
      </p>
    </section>

    <!-- FOOTER -->
    <footer class="landing-footer">
      <span>Powered by <strong>ÍndiceIA</strong></span>
    </footer>

  </main>

  <!-- SCRIPT -->
  <script type="module" src="./landing.js"></script>
