<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Asistente IA del comercio</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- CSS -->
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="./landing.css" />

  <!-- JS -->
  <script type="module" src="./landing.js"></script>
</head>

<body class="landing-body">

  <main class="landing-container">

    <!-- HEADER -->
    <header class="landing-header">
      <img id="logo" class="landing-logo" alt="Logo del comercio" />
      <h1 id="nombreComercio" class="landing-commerce-name"></h1>
    </header>

    <!-- HERO -->
    <section class="landing-hero">
      <img id="hero" class="landing-hero-image" alt="Imagen principal" />
    </section>

    <!-- CONTENT -->
    <section class="landing-content">
      <h2 id="titulo" class="landing-title"></h2>
      <p id="descripcion" class="landing-description"></p>
    </section>

    <!-- CTA -->
    <section class="landing-cta">
      <button id="ctaButton" class="btn btn-primary btn-lg">
        <span id="ctaText">Hablar con la IA</span>
      </button>
      <p id="disclaimer" class="landing-disclaimer"></p>
    </section>

    <!-- FOOTER -->
    <footer class="landing-footer">
      <p>
        Esta IA fue generada por el comercio.
        <br />
        <span class="powered">
          Tecnología de asistentes inteligentes — ÍndiceIA
        </span>
      </p>
    </footer>

  </main>

</body>
</html>
