<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Asistente Virtual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Estilos base reutilizables -->
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="./landing.css" />

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="landing-body">

  <main class="landing-container">

    <div class="landing-card">

      <div class="landing-header">
        <img id="logo" class="landing-logo" alt="Logo comercio" />
        <h1 id="nombreComercio">Cargando…</h1>
        <p id="descripcion" class="landing-description"></p>
      </div>

      <div class="landing-disclaimer">
        <p>
          Este es el <strong>asistente virtual oficial</strong> del comercio.
          La información provista es automática y se basa únicamente en los datos del negocio.
        </p>
      </div>

      <button id="ctaBtn" class="btn btn-primary btn-lg">
        <i class="fas fa-robot"></i>
        Hablar con el asistente
      </button>

      <div class="landing-footer">
        <small>
          Al continuar aceptás interactuar con una inteligencia artificial.
        </small>
      </div>

    </div>

  </main>

  <script type="module" src="./landing.js"></script>
</body>
</html>
