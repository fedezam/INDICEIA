<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear entidad | ÍndiceIA</title>

  <link rel="stylesheet" href="./crear-entidad.css" />
</head>
<body>

  <main class="main-content crear-entidad-page">

    <header class="header">
      <h1>Crear nueva entidad</h1>
      <p>Elegí qué tipo de entidad querés activar en ÍndiceIA</p>
    </header>

    <section class="entity-grid">

      <button class="entity-card" data-type="comercio">
        <h2>Comercio</h2>
        <p>Negocio físico o digital con IA comercial</p>
      </button>

      <button class="entity-card disabled" data-type="servicio">
        <h2>Servicio</h2>
        <p>Próximamente</p>
      </button>

    </section>

  </main>

  <script type="module" src="./crear-entidad.js"></script>
</body>
</html>
